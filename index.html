  /* 时刻调色：不是简单调暗，而是重新分配明暗 + 染色 */
  function gradePixel(r, g, b, tk){
    var l = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
    var sh, hi, gam, gain, sat, warm;
    if(tk === 'night'){      sh=[8,13,34];   hi=[255,210,150]; gam=1.5;  gain=.66; sat=.44; warm=48; }
    else if(tk === 'dawn'){  sh=[52,38,64];  hi=[255,198,158]; gam=1.00; gain=.98; sat=1.02; warm=10; }
    else if(tk === 'dusk'){  sh=[40,24,48];  hi=[255,146,88];  gam=1.14; gain=.88; sat=1.08; warm=16; }
    else {                   sh=[205,224,238];hi=[255,252,236];gam=.96;  gain=1.06; sat=1.06; warm=0;  }

    var R = Math.pow(clamp(r/255,0,1), gam) * gain * 255;
    var G = Math.pow(clamp(g/255,0,1), gam) * gain * 255;
    var B = Math.pow(clamp(b/255,0,1), gam) * gain * 255;

    // 暗部染夜色／亮部染天光
    var ws = Math.pow(1-l, 2.2) * (tk==='day' ? .10 : (tk==='night' ? .60 : .48));
    var wh = Math.pow(l, 2.0) * (tk==='day' ? .12 : .38);
    R = R*(1-ws) + sh[0]*ws; G = G*(1-ws) + sh[1]*ws; B = B*(1-ws) + sh[2]*ws;
    R = R*(1-wh) + hi[0]*wh; G = G*(1-wh) + hi[1]*wh; B = B*(1-wh) + hi[2]*wh;

    // 去饱和
    var L2 = 0.2126*R + 0.7152*G + 0.0722*B;
    R = L2 + (R-L2)*sat; G = L2 + (G-L2)*sat; B = L2 + (B-L2)*sat;

    // 夜里：亮的地方（窗灯、路灯）继续暖亮，暗处压成深蓝 → 像"夜"，而不是单纯调暗
    if(warm > 0 && l > .58){
      var k = (l - .58) / .42;
      R += warm*k; G += warm*.6*k; B += warm*.12*k;
    }
    return [clamp(R,0,255), clamp(G,0,255), clamp(B,0,255)];
  }

  function drawTimeVeil(c, w, h){
    var g = c.createLinearGradient(0,0,0,h), tk = state.time;
    if(tk === 'night'){
      g.addColorStop(0,'rgba(9,16,42,.50)');
      g.addColorStop(.55,'rgba(7,12,30,.26)');
      g.addColorStop(1,'rgba(3,6,18,.38)');
    } else if(tk === 'dawn'){
      g.addColorStop(0,'rgba(58,58,108,.30)');
      g.addColorStop(.7,'rgba(240,160,140,.16)');
      g.addColorStop(1,'rgba(255,182,140,.10)');
    } else if(tk === 'dusk'){
      g.addColorStop(0,'rgba(30,20,60,.32)');
      g.addColorStop(.7,'rgba(200,90,60,.20)');
      g.addColorStop(1,'rgba(240,140,80,.14)');
    } else {
      g.addColorStop(0,'rgba(176,212,240,.10)');
      g.addColorStop(1,'rgba(255,250,230,.05)');
    }
    c.fillStyle = g; c.fillRect(0,0,w,h);
  }

  /* 高质量降采样：逐步减半，避免一次性缩放糊成一片 */
  function drawSmoothDown(src, dw, dh){
    var cw = src.width || 696, ch = src.height || 600;
    var cur = src;
    var a = document.createElement('canvas'), b = document.createElement('canvas');
    var target = a, flip = false;
    while(cw > dw*2 && ch > dh*2){
      cw = Math.max(dw, Math.round(cw/2));
      ch = Math.max(dh, Math.round(ch/2));
      target.width = cw; target.height = ch;
      var tcx = target.getContext('2d');
      tcx.imageSmoothingEnabled = true;
      tcx.clearRect(0,0,cw,ch);
      tcx.drawImage(cur, 0, 0, cw, ch);
      cur = target;
      flip = !flip;
      target = flip ? b : a;
    }
    gridCx.imageSmoothingEnabled = true;
    gridCx.clearRect(0,0,gridCv.width,gridCv.height);
    gridCx.drawImage(cur, 0, 0, gridCv.width, gridCv.height);
  }

  /* 轻锐化（4 邻域拉普拉斯）：让像素边缘利落，不再糊成一团 */
  function sharpenPixels(d, w, h, amt){
    var src = new Uint8ClampedArray(d);
    for(var y=1;y<h-1;y++){
      for(var x=1;x<w-1;x++){
        var i = (y*w + x)*4;
        for(var ch=0;ch<3;ch++){
          var c0 = src[i+ch];
          var sum = src[i-4+ch] + src[i+4+ch] + src[i-w*4+ch] + src[i+w*4+ch];
          d[i+ch] = c0 + (c0*4 - sum) * (amt*0.55);
        }
      }
    }
  }

  function buildPhotoGrid(){
    if(!photo) return;
    var p = photoParams;
    var gw = Math.max(2, Math.round(OW / p.block));
    var gh = Math.max(2, Math.round(OH / p.block));
    gridCv.width = gw; gridCv.height = gh;
    drawSmoothDown(photo.img, gw, gh);

    var imgData = gridCx.getImageData(0, 0, gw, gh);
    var d = imgData.data;
    var br = p.bright/100*95, ct = 1 + p.contrast/100*1.15, sa = 1 + p.sat/100;
    var i;

    // 明暗 / 对比 / 饱和 / 时刻调色
    for(i=0;i<d.length;i+=4){
      var r = d[i], g = d[i+1], b = d[i+2];
      r += br; g += br; b += br;
      r = (r-128)*ct + 128; g = (g-128)*ct + 128; b = (b-128)*ct + 128;
      var lum = 0.2126*r + 0.7152*g + 0.0722*b;
      r = lum + (r-lum)*sa; g = lum + (g-lum)*sa; b = lum + (b-lum)*sa;
      var gr = gradePixel(r, g, b, state.time);
      d[i] = gr[0]; d[i+1] = gr[1]; d[i+2] = gr[2];
    }

    // 锐化，再量化（保证锐化后的边缘也落进有限色板）
    if(p.sharpen > 2) sharpenPixels(d, gw, gh, p.sharpen/100);
    var L = Math.max(2, Math.round(p.levels));
    var step = 255/(L-1);
    for(i=0;i<d.length;i+=4){
      d[i]   = clamp(Math.round(clamp(d[i],0,255)/step)*step, 0, 255);
      d[i+1] = clamp(Math.round(clamp(d[i+1],0,255)/step)*step, 0, 255);
      d[i+2] = clamp(Math.round(clamp(d[i+2],0,255)/step)*step, 0, 255);
    }
    gridCx.putImageData(imgData, 0, 0);
  }

  function rebuildPhotoLayer(){
    if(!photo) return;
    buildPhotoGrid();
    photoCtx.imageSmoothingEnabled = false;
    photoCtx.clearRect(0,0,OW,OH);
    photoCtx.drawImage(gridCv, 0, 0, gridCv.width, gridCv.height, 0, 0, OW, OH);
    drawTimeVeil(photoCtx, OW, OH);
    photoDirty = false;
    photoPainted = true;
  }

  /* ---------- 分析：按颜色 / 明暗 / 构图猜它像什么 ---------- */
  function analyzePhoto(){
    var tmp = document.createElement('canvas');
    tmp.width = 116; tmp.height = 100;
    var tc = tmp.getContext('2d');
    tc.drawImage(photo.img, 0, 0, 116, 100);
    var d = tc.getImageData(0,0,116,100).data;

    var n = 116*100, sumL=0, dark=0, bright=0, blue=0, blueTop=0, blueBot=0;
    var green=0, cyan=0, warmBright=0;
    var rowL = new Float32Array(100);

    for(var y=0;y<100;y++){
      var rowSum = 0;
      for(var x=0;x<116;x++){
        var i = (y*116+x)*4, r=d[i], g=d[i+1], b=d[i+2];
        var l = (0.2126*r + 0.7152*g + 0.0722*b)/255;
        rowSum += l; sumL += l;
        if(l < .25) dark++;
        if(l > .78) bright++;
        if(b > r+14 && b > g+2){ blue++; if(y < 45) blueTop++; else blueBot++; }
        if(g > r+10 && g > b+6) green++;
        if(g > r+10 && b > r+10) cyan++;
        if(l > .70 && r > b+25) warmBright++;
      }
      rowL[y] = rowSum/116;
    }

    var avgL = sumL/n;
    var darkR = dark/n, brightR = bright/n, greenR = green/n, cyanR = cyan/n;
    var blueTopR = blueTop/(45*116), blueBotR = blueBot/(55*116);
    var warmR = warmBright/n;

    // 地平线：相邻行亮度最大跳变
    var jump = 0;
    for(var y2=6;y2<94;y2++){ var dj = Math.abs(rowL[y2]-rowL[y2-1]); if(dj>jump) jump=dj; }
    var hasHorizon = jump > 0.12;

    var sc = {
      sky:        clamp(blueTopR*1.5 + brightR*0.7 + (hasHorizon?0.15:0) - (darkR>0.62?0.55:0), 0, 2),
      water:      clamp(blueBotR*1.7 + cyanR*0.8 + (hasHorizon?0.2:0), 0, 2),
      vegetation: clamp(greenR*2.1, 0, 2),
      night:      clamp(darkR*1.7 + (1-avgL)*0.45 - (brightR>0.5?0.3:0), 0, 2),
      lights:     clamp(warmR*4.6 + (darkR>0.42?0.25:0), 0, 2)
    };

    var pct = function(v){ return (v*100).toFixed(1)+'%'; };
    var defs = {
      sky: { label:'天空', why:'上半部分蓝色像素占 '+pct(blueTopR)+'，整体偏亮（平均亮度 '+Math.round(avgL*255)+'/255）→ 像一片天空' },
      water: { label:'水面', why:'下半部分蓝色/青色像素占 '+pct(blueBotR)+'，'+(hasHorizon?'画面中间有一条明显的明暗分界（差 '+jump.toFixed(2)+'）→ 像水面的地平线':'颜色大片铺开且很均匀 → 像水面') },
      vegetation: { label:'植被', why:'绿色像素占 '+pct(greenR)+' → 像树、草、山林这一类的绿' },
      night: { label:'夜景', why:'平均亮度只有 '+Math.round(avgL*255)+'/255，暗部占 '+pct(darkR)+' → 像夜里或很暗的场景' },
      lights: { label:'灯光', why:'有 '+pct(warmR)+' 的小块暖色高光，和周围暗部反差大 → 像窗灯、路灯、火光' }
    };

    var tags = [];
    Object.keys(sc).forEach(function(k){
      if(sc[k] >= 0.45){ tags.push({ key:k, label:defs[k].label, why:defs[k].why, score:sc[k] }); }
    });
    tags.sort(function(a,b){ return b.score - a.score; });
    tags = tags.slice(0, 3);

    if(!tags.length){
      tags = [{ key:'neutral', label:'不好判断', why:'颜色比较杂、明暗反差不大，没有哪一类特别突出 —— 这时候按你的耳朵来选声音更靠谱', score:0 }];
    }
    return tags;
  }

  /* ---------- 声音推荐（附理由，不锁定） ---------- */
  function buildRecs(tags){
    var out = [], seen = {};
    function add(id, why){
      if(seen[id] || out.length >= 5) return;
      seen[id] = 1; out.push({ id:id, why:why });
    }
    tags.forEach(function(t){
      if(t.key === 'water'){ add('waves','判断为水面 → 一层层推过来的浪'); add('river','水在流动 → 连续的溪水声'); }
      if(t.key === 'night'){ add('crickets','判断为夜景 → 安静的虫鸣最像夜里'); add('wind','夜色里总得有一点风'); }
      if(t.key === 'vegetation'){ add('birds','有绿色植被 → 用鸟叫把空间撑开'); add('wind-in-trees','叶子会响 → 林间风'); }
      if(t.key === 'lights'){ add('campfire','暖色光点 → 炉火的噼啪声最贴'); add('wind-chimes','灯光和小物件 → 一点风铃当点缀'); }
      if(t.key === 'sky'){ add('wind','开阔的天空 → 高处的风声'); add('birds','远景很空 → 远处的鸟叫'); }
    });
    if(out.length < 3){
      add('wind','兜底底噪：不抢戏，什么画面都能配');
      add('brown-noise','低频暖底噪，把整个画面稳住');
      add('wind-chimes','偶尔一声，给画面留个呼吸');
    }
    return out.slice(0, 5);
  }

  /* ---------- 本地存储：只存缩小后的图 + 参数 ---------- */
  function savePhoto(){
    if(!photo) return;
    try{
      localStorage.setItem(PHOTO_KEY, JSON.stringify({
        v:1,
        url: photo.url,
        params: photoParams,
        tags: photo.tags,
        rec: photo.rec,
        applied: state.scene === 'photo'
      }));
    }catch(e){}
  }
  var saveTimer = null;
  function savePhotoSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(savePhoto, 700); }

  function loadSavedPhoto(){
    var raw = null;
    try{ raw = localStorage.getItem(PHOTO_KEY); }catch(e){ return; }
    if(!raw) return;
    var o = null;
    try{ o = JSON.parse(raw); }catch(e){ return; }
    if(!o || !o.url) return;

    if(o.params){
      ['block','levels','bright','contrast','sat','sharpen'].forEach(function(k){
        if(typeof o.params[k] === 'number') photoParams[k] = o.params[k];
      });
    }
    var img = new Image();
    img.onload = function(){
      photo = { img:img, url:o.url, tags:o.tags || null, rec:o.rec || null };
      try{
        if(!photo.tags || !photo.tags.length) photo.tags = analyzePhoto();
        if(!photo.rec || !photo.rec.length) photo.rec = buildRecs(photo.tags);
      }catch(e){ photo.tags = photo.tags || []; photo.rec = photo.rec || []; }

      SCENES.photo = { name:'我的窗外', sounds: photo.rec.map(function(r){ return r.id; }), keepFire:true };
      photoDirty = true;
      buildChips();
      syncParamUI();
      updateModalState();

      if(o.applied){
        state.scene = 'photo';
        SOUNDS.forEach(function(s){
          state.tracks[s.id].on = SCENES.photo.sounds.indexOf(s.id) >= 0;
        });
        state.lamp = state.lamp;
        syncChips(); syncSoundUI(); updateCounts(); updatePhTag();
      }
      photoDirty = true;
    };
    img.onerror = function(){ /* 存坏了就忽略，不影响页面 */ };
    img.src = o.url;
  }

  /* ---------- 弹窗 ---------- */
  var modal = $('#photoModal');
  var dropZone = $('#dropZone');
  var previewCanvas = $('#previewCanvas');
  var previewCtx = previewCanvas.getContext('2d');

  var PARAM_DEFS = [
    { key:'block', label:'颗粒粗细', min:1, max:8, step:1,
      hint:'数字越大，照片被切成越大的方块，越像老游戏；数字小就更接近原照片。' },
    { key:'levels', label:'颜色数量', min:3, max:14, step:1,
      hint:'每种颜色只保留几个档位。数字小 → 颜色更少、更像像素画；数字大 → 颜色更丰富。' },
    { key:'bright', label:'明暗', min:-40, max:40, step:1,
      hint:'整体调亮或调暗。往右更亮，像白天；往左更暗，像傍晚。' },
    { key:'contrast', label:'对比度', min:-30, max:30, step:1,
      hint:'明暗之间的差距。调大变硬朗（黑影更黑、亮处更亮），调小变柔和、有点灰。' },
    { key:'sat', label:'颜色浓淡', min:-40, max:40, step:1,
      hint:'颜色的鲜艳程度。往左接近黑白，往右颜色更浓。' },
    { key:'sharpen', label:'清晰度', min:0, max:100, step:5,
      hint:'让边缘更利落。调高照片更清楚，调太高会出现硬边和小黑点。' }
  ];

  function fmtParam(d, v){
    if(d.key === 'block') return v + '×' + v;
    if(d.key === 'levels') return v + ' 档';
    return (v > 0 ? '+' : '') + v;
  }

  function buildParamUI(){
    var box = $('#params');
    PARAM_DEFS.forEach(function(d){
      var row = document.createElement('div'); row.className = 'pm';
      var top = document.createElement('div'); top.className = 'pmTop';
      var nm = document.createElement('span'); nm.textContent = d.label;
      var val = document.createElement('span'); val.className = 'pmVal';
      top.appendChild(nm); top.appendChild(val);

      var inp = document.createElement('input');
      inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.step;
      inp.setAttribute('aria-label', d.label);
      inp.addEventListener('input', function(){
        photoParams[d.key] = Number(inp.value);
        val.textContent = fmtParam(d, photoParams[d.key]);
        if(photo && state.scene === 'photo') photoDirty = true;
        previewLater();
        savePhotoSoon();
      });

      var hint = document.createElement('div'); hint.className = 'pmHint'; hint.textContent = d.hint;
      row.appendChild(top); row.appendChild(inp); row.appendChild(hint);
      box.appendChild(row);
      d._inp = inp; d._val = val;
    });
  }

  function syncParamUI(){
    PARAM_DEFS.forEach(function(d){
      d._inp.value = String(photoParams[d.key]);
      d._val.textContent = fmtParam(d, photoParams[d.key]);
      fillRange(d._inp);
    });
    var tn = $('#timeNote');
    if(tn) tn.innerHTML = '当前时刻：<b>' + TIMES[state.time].name + '</b> —— 时刻会给照片重新上色（夜里是蓝色夜景，不是单纯调暗）。';
  }

  var pvQueued = false;
  function previewLater(){
    if(pvQueued) return;
    pvQueued = true;
    requestAnimationFrame(function(){ pvQueued = false; renderPreview(); });
  }

  function renderPreview(){
    if(!photo) return;
    if(photoDirty || !photoPainted) rebuildPhotoLayer();
    previewCtx.imageSmoothingEnabled = false;
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    previewCtx.drawImage(photoLayer, 0, 0, OW, OH, 0, 0, previewCanvas.width, previewCanvas.height);
  }

  function showAnalysis(){
    var box = $('#analysis');
    if(!photo || !photo.tags || !photo.tags.length){
      box.innerHTML = '<div class="anaEmpty">还没有照片。拖一张进来，我会按颜色和明暗猜一猜它像什么。</div>';
      return;
    }
    var tagHtml = photo.tags.map(function(t){ return '<span class="tag">' + t.label + '</span>'; }).join('');
    var ev = photo.tags.map(function(t){ return '<li>' + t.why + '</li>'; }).join('');
    box.innerHTML =
      '<div class="secH" style="margin-bottom:0">这张照片像什么（推断）</div>' +
      '<div class="anaTags">' + tagHtml + '</div>' +
      '<ul class="anaList">' + ev + '</ul>' +
      '<div class="anaWarn">这是根据颜色和构图的猜测，不是真的认出了内容。' +
      '照片只在这台电脑上处理，没有上传到任何服务器。</div>';
  }

  function showRecs(){
    var box = $('#recs');
    if(!photo || !photo.rec || !photo.rec.length){
      box.innerHTML = '<div class="anaEmpty">有照片之后，这里会给出 3~5 条建议，并写清楚为什么。</div>';
      return;
    }
    box.innerHTML = photo.rec.map(function(r){
      var s = null;
      for(var i=0;i<SOUNDS.length;i++){ if(SOUNDS[i].id === r.id){ s = SOUNDS[i]; break; } }
      return '<div class="recRow"><div class="recName">' + (s ? s.name : r.id) + '</div>' +
             '<div class="recWhy">' + r.why + '</div></div>';
    }).join('') + '<div class="note" style="margin-top:8px">应用后会按这些打开，但你可以随时在「声音」里改回自己喜欢的组合。</div>';
  }

  function updateModalState(){
    var has = !!photo;
    dropZone.classList.toggle('has', has);
    $('#applyBtn').disabled = !has;
    $('#fileInfo').textContent = has ? '已在本地缓存 · 可随时重调' : '还没有照片';
    if(has){ renderPreview(); }
    showAnalysis(); showRecs();
    syncParamUI();
  }

  function openModal(){
    modal.hidden = false;
    updateModalState();
  }
  function closeModal(){
    modal.hidden = true;
    if(photo) savePhoto();
  }

  function loadFile(file){
    if(!file) return;
    if(file.type && file.type.indexOf('image/') !== 0){ toast('这个不是图片文件'); return; }
    if(file.size > 30*1024*1024){ toast('照片超过 30MB，换一张小一点的吧'); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var c = document.createElement('canvas');
        c.width = 696; c.height = 600;
        var cx = c.getContext('2d');
        var s = Math.max(696/img.width, 600/img.height);
        var w = img.width*s, h = img.height*s;
        cx.imageSmoothingEnabled = true;
        cx.imageSmoothingQuality = 'high';
        cx.drawImage(img, (696-w)/2, (600-h)/2, w, h);

        photo = {
          img: c,
          url: c.toDataURL('image/jpeg', .82),   // 只存缩小版，不存原图
          tags: null, rec: null
        };
        photo.tags = analyzePhoto();
        photo.rec = buildRecs(photo.tags);
        SCENES.photo = { name:'我的窗外', sounds: photo.rec.map(function(r){ return r.id; }), keepFire:true };
        photoDirty = true;
        buildChips();
        updateModalState();
        $('#fileInfo').textContent = img.width + '×' + img.height + ' · ' + Math.round(file.size/1024) + 'KB（已缩小后存本地）';
        savePhoto();
        if(state.scene === 'photo') toast('照片已换，窗外立刻更新');
      };
      img.onerror = function(){ toast('这张图片读不出来，换一张试试'); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function applyPhoto(){
    if(!photo) return;
    var keep = $('#keepSounds').checked;
    SCENES.photo = { name:'我的窗外', sounds: photo.rec.map(function(r){ return r.id; }), keepFire:true };
    snapshotOutside(); flashVeil();
    state.scene = 'photo';
    if(!keep){
      SOUNDS.forEach(function(s){
        state.tracks[s.id].on = SCENES.photo.sounds.indexOf(s.id) >= 0;
      });
    }
    photoDirty = true;
    closeModal();
    syncChips(); syncSoundUI(); updateCounts(); updatePhTag();
    savePhoto();
    toast(keep
      ? '已应用为场景 · 窗外换成了你的照片，声音保持原样'
      : '已应用为场景 · 并按推荐选了 ' + SCENES.photo.sounds.length + ' 条声音（随时能改）');
  }

  var toastTimer = null;
  function toast(msg){
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3400);
  }

  function updatePhTag(){
    var el = document.querySelector('.phTag');
    if(!el) return;
    el.textContent = (state.scene === 'photo' && photo)
      ? '窗外：你的照片 · 屋里仍是代码绘制的房间'
      : '这是占位场景 · 代码绘制，窗外画面等你换成照片';
  }

  // 弹窗事件
  $('#importBtn').addEventListener('click', openModal);
  $('#modalClose').addEventListener('click', closeModal);
  $('#cancelBtn').addEventListener('click', closeModal);
  $('#modalBg').addEventListener('click', closeModal);
  $('#applyBtn').addEventListener('click', applyPhoto);

  $('#pickBtn').addEventListener('click', function(){ $('#fileInput').click(); });
  $('#pickInline').addEventListener('click', function(){ $('#fileInput').click(); });
  $('#fileInput').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
    e.target.value = '';
  });

  // 粘贴
  $('#pasteBtn').addEventListener('click', function(){
    toast('按 Ctrl+V 就能把剪贴板里的图片贴进来');
  });
  document.addEventListener('paste', function(e){
    if(modal.hidden) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image') === 0){
        var f = items[i].getAsFile();
        if(f){ loadFile(f); e.preventDefault(); return; }
      }
    }
  });

  // 拖拽
  ['dragenter','dragover'].forEach(function(ev){
    modal.addEventListener(ev, function(e){
      e.preventDefault();
      dropZone.classList.add('over');
    });
  });
  ['dragleave','dragend'].forEach(function(ev){
    modal.addEventListener(ev, function(e){
      e.preventDefault();
      if(e.target === modal || e.target === dropZone) dropZone.classList.remove('over');
    });
  });
  modal.addEventListener('drop', function(e){
    e.preventDefault();
    dropZone.classList.remove('over');
    var files = e.dataTransfer && e.dataTransfer.files;
    if(files && files.length) loadFile(files[0]);
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){ e.preventDefault(); });

  /* =========================================================
     7. 启动
     ========================================================= */
  buildChips();
  buildSoundUI();
  buildParamUI();

  // 初始：雨夜 + 夜 + 台灯亮，但绝不自动出声
  (function init(){
    var sc = SCENES[state.scene];
    SOUNDS.forEach(function(s){ state.tracks[s.id].on = sc.sounds.indexOf(s.id) >= 0; });
    state.lamp = true;
    state.fire = false;
    syncChips(); syncSoundUI(); updateCounts(); updatePhTag();
  })();

  // 刷新后恢复上次的照片与参数（只读本地缓存，不联网）
  loadSavedPhoto();
  syncParamUI();
  Array.prototype.forEach.call(document.querySelectorAll('input[type=range]'), fillRange);

  requestAnimationFrame(loop);

  // 供自测/调试用
  window.__cabin = {
    state: state, SOUNDS: SOUNDS, els: els, catState: catState,
    photoParams: photoParams,
    togglePlayback: togglePlayback,
    handleVisibility: handleVisibility,
    noiseGain: function(id){
      return (noiseNodes[id] && noiseNodes[id].gn) ? noiseNodes[id].gn.gain.value : 0;
    },
    getPhoto: function(){ return photo; }
  };
})();
</script>
</body>
</html>
